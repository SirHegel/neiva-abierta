[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Maps/Neiva
GameDefaultMap=/Game/Maps/Neiva
GlobalDefaultGameMode=/Script/NeivaAbierta.NeivaGameMode

[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.Shadow.Virtual.Enable=1
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-980.000000

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
; UE 5.5's engine default targets only Vulkan SM5. Cook SM6 explicitly for
; Lumen/Virtual Shadow Maps on the supported Vulkan GPU; verify the selected RHI.
-TargetedRHIs=SF_VULKAN_SM5
+TargetedRHIs=SF_VULKAN_SM6

[ConsoleVariables]
; The mapped city uses procedural (non-Nanite) meshes. Keep their visible
; shadows, but omit expensive coarse pages used for volumetric shadow sampling.
r.Shadow.Virtual.NonNanite.IncludeInCoarsePages=0
